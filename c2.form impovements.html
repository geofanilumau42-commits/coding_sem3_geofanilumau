<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form HTML5</h1>
    <p>
        <label>
            Name:
            <input 
            type="text"
            name="firstname"
            placeholder="Masukkan nama kamu"
            autocomplete>
        </label>
    </p>

     <p>
        <label>
            Cari:
            <input 
            type="search"
            name="query"
            autofocus
            placeholder="Ketik untuk mencari">
        </label>
    </p>

    <button type="submit">Kirim</button>
</body>
</html>
