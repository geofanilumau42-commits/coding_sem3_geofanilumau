<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML5 Input Types</h1>
    <p>
        <label>
            Number:
            <input type="number" name="number">
        </label>
    </p>
    <p>
        <label>
            Number (-5 sampai 25):
            <input type="number" name="number2" min="-5" max="25" step="5">
        </label>
    </p>
    <p>
        <label>
            Range(1-100):
            <input type="range" name="range" min="1" max="100" step="5">
        </label>
    </p>
    <p>
        <label>
            Range(-1000 sampai 1000):
            <input type="range" name="range2" min="-1000" max="1000" step="100">
        </label>
    </p>
     <p>
        <label>
            Telephone:
            <input type="tel" name="telno">
        </label>
    </p>
     <p>
        <label>
            Email:
            <input type="email" name="email">
        </label>
    </p>
     <p>
        <label>
            URL:
            <input type="url" name="url">
        </label>
    </p>
</body>
</html>
