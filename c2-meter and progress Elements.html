<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contoh Elemen HTML5</h1>
    <h2>Meter</h2>
    <p>
        Warp Drive Output:
        <meter min="0" max="10" value="9.5">
            9.5 dari 10
        </meter>
    </p>

    <h2>Progress</h2>
    <p>
        Progress:
        <progress max="100" value="33.1">
            33.1%
        </progress>
    </p>

    <h2>Details</h2>
    <details>
        <summary>Klik untuk melihat informasi</summary>
        <p>Ini adalah informasi tambahan yang disembunyikan.</p>
    </details>
</body>
</html>
