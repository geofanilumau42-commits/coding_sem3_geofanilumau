<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data Attribute</h1>

    <p id="nama" data-author="Geo">
        Data tersimpan di elemen ini.
    </p>

    <button onclick="tampilkanData()">
        Tampilkan Data
    </button>

    <p id="hasil"></p>

    <script>
        function tampilkanData(){
            var data=document
            .getElementById("nama")
            .getAttribute("data-author");

        document.getElementById("hasil").textContent= 
            "Author." + data;
        }
    </script>
</body>
</html>
