<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Image Map</h1>
    <p>Klik bagian gambar yang susah ditentukan:</p>

    <img src="maps.jpeg"
        width="400"
        height="300"
        usemap="#peta"  
        alt="Gambar dengan area yang dapat diklik">

    <map name="peta">
        <area shape="rect" 
        coords="0,0,200,150"
        href="https://www.google.com"
        alt="Bagian kiri atas">

    <area shape="circle" 
        coords="300,150,50" 
        href="https://www.wikipedia.org" 
        alt="Lingkaran">
    </map>
</body>
</html>
